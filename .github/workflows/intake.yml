name: Intake Agent

on:
  push:
    paths:
      - 'workflows/**/scripts/*'
  workflow_dispatch:
    inputs:
      debug:
        description: 'Run in debug mode'
        required: false
        default: 'false'

jobs:
  intake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Intake Agent
        run: |
          # Extract changed scripts
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | grep 'workflows/.*/scripts/')
          for file in $CHANGED_FILES; do
            dir=$(dirname "$file")
            workflow_name=$(basename "$dir")
            metadata_file="$dir/metadata.yaml"
            docs_file="docs/_workflows/${workflow_name}.md"
            test_file="tests/${workflow_name}_smoke.sh"

            # Generate metadata.yaml
            echo "name: $workflow_name

description: Auto-generated workflow for $(basename "$file")
version: 1.0.0
status: ⚪ Experimental

environment:
  hpc: mn5

inputs:
  - name: input_dir
    type: directory
    required: true

outputs:
  - name: output_files
    type: file

dependencies:
  modules:
    - nco/4.9.3
    - cdo/1.9.8

owner: climate_group" > "$metadata_file"

            # Generate docs
            echo "# $workflow_name

Auto-generated documentation for $(basename "$file")." > "$docs_file"

            # Generate test
            echo '#!/bin/bash

echo "✅ Smoke test placeholder"' > "$test_file"
            chmod +x "$test_file"
          done

      - name: Create Draft PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(intake): generate docs and metadata for updated scripts"
          title: "chore(intake): onboard ${{ github.ref_name }}"
          body: "Auto-generated docs, metadata, and tests for updated scripts."
          branch: "intake/${{ github.ref_name }}"
          draft: true