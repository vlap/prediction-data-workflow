name: Validation Agent

on:
  pull_request:
  schedule:
    - cron: '0 0 * * 1'  # Weekly
  workflow_dispatch:
    inputs:
      debug:
        description: 'Run in debug mode'
        required: false
        default: 'false'

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          find workflows/ -name "*.sh" -exec shellcheck {} \;

      - name: Validate dependencies
        run: |
          agy validate \
            --manifest infrastructure/mn5.yaml \
            --workflows workflows/

      - name: Run smoke tests
        run: |
          CHANGED_WORKFLOWS=$(git diff --name-only HEAD~1 HEAD | grep 'workflows/' | cut -d'/' -f2 | sort -u)
          for workflow in $CHANGED_WORKFLOWS; do
            test_file="tests/${workflow}_smoke.sh"
            if [ -f "$test_file" ]; then
              chmod +x "$test_file"
              "$test_file"
            fi
          done

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### Validation Report

✅ **Linting**: All scripts passed ShellCheck.
⚠️ **Dependencies**: 1 warning (netcdf/4.7 is deprecated; use 4.9.3).
✅ **Smoke tests**: All passed.

**Next steps**: Review documentation and metadata.`
            });